<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMBROS - Controle de Acesso</title>
  <meta name="description" content="Sistema de controle de acesso para condomínio residencial, gerenciando moradores, veículos, visitantes e acessos de portaria.">
  <meta property="og:title" content="AMBROS - Controle de Acesso">
  <meta property="og:description" content="Sistema de controle de acesso para condomínio residencial, gerenciando moradores, veículos, visitantes e acessos de portaria.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <style>
    body {
      margin: 0;
      background: #1b2434;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #2f6bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <div style="font-weight: 600; letter-spacing: 1px;">AMBROS · Carregando...</div>
  </div>
  <script>
    // Redirecionamento por perfil: morador → portal, demais → dashboard.
    (function () {
      try {
        var raw = localStorage.getItem("ambros_usuario") || sessionStorage.getItem("ambros_usuario") || "{}";
        var u = JSON.parse(raw);
        var destino = "ambros-dashboard.html";
        if (u.perfil === "morador") destino = "portal-morador.html";
        window.location.replace(destino);
      } catch (_) {
        window.location.replace("login.html");
      }
    })();
  </script>
</body>
</html>
